    <text x="90" y="330" fill="url(#sc-title)" font-size="86" font-weight="700" letter-spacing="-3">BIG IDEAS.</text>
    <text x="90" y="410" fill="#a9b2cf" font-size="34">I build browser games for curious minds.</text>
