    <text x="90" y="550" fill="#35e6ff" font-size="26" font-weight="600">Instant play · no installs · made with curiosity</text>
  </g>

  <g transform="translate(940 400) scale(1.9)" fill="none" stroke="#eef1ff" stroke-opacity="0.85" stroke-width="3">
    <rect x="0" y="0" width="120" height="58" rx="26" />
    <path d="M32 18v22M21 29h22" stroke-width="4" />
    <circle cx="86" cy="22" r="6" fill="#c6ff5e" stroke="none" />
