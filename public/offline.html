<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Hemang Gupta arcade</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        background: #070a16;
        color: #eef1ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      .card {
        max-width: 34rem;
        padding: 2.5rem;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.04);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.6rem, 6vw, 2.4rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1rem;
        color: #a9b2cf;
      }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: linear-gradient(100deg, #35e6ff, #a084ff 55%, #ff4d97);
        color: #050a18;
        font-weight: 700;
        text-decoration: none;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 56px;
        height: 56px;
        margin-bottom: 1rem;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        font-size: 1.6rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="mark" aria-hidden="true">🎮</p>
      <h1>You are offline</h1>
      <p>
        The arcade shell was cached on this device, but the page you asked for needs a connection — and game builds are
        never cached offline on purpose, so nothing stale gets served to you.
      </p>
      <p>Reconnect and try again, or go back to the home page.</p>
      <a href="/">Try the home page</a>
    </main>
  </body>
</html>
